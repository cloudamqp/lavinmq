name: lavinmq-booth-demo
version: 0.1.0

description: |
  Conference booth demo for a LavinMQ cluster: load scenarios plus a big-screen
  dashboard that shows the cluster failing over when a node loses power.

authors:
  - Carl Hörberg <carl@84codes.com>

targets:
  booth:
    main: src/booth.cr

dependencies:
  amqp-client:
    github: cloudamqp/amqp-client.cr
  mqtt-protocol:
    github: 84codes/mqtt-protocol.cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ">= 1.7.0"

crystal: ">= 1.21.0"

license: Apache-2.0
