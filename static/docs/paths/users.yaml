    description: Create new user, or update an existing user.
    summary: Create/update user
    operationId: PutUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../openapi.yaml#/components/schemas/users-PutUserRequestBody"
    responses:
      '201':
        description: The user was created successfully.
      '204':
