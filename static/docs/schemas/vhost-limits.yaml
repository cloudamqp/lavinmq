---
vhost-limits:
  type: object
  properties:
    vhost:
      type: string
      description: Name of the vhost.
    value:
      type: object
      description: Limits set on the vhost. Only limits with a value are present.
      properties:
        max-connections:
          type: integer
          description: Maximum number of concurrent connections allowed to the vhost.
        max-queues:
          type: integer
          description: Maximum number of queues allowed in the vhost.
        max-retained-messages:
          type: integer
          description: Maximum number of retained MQTT messages allowed in the vhost.
        max-retained-message-size:
          type: integer
          description: Maximum payload size, in bytes, of one retained MQTT message in the vhost.
        retained-message-ttl:
          type: integer
          description: Maximum age, in seconds, of a retained MQTT message in the vhost.
