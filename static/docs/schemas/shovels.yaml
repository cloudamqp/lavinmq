---
ShovelList:
  type: array
  description: List of shovels
  items:
    "$ref": "#/Shovel"

Shovel:
  type: object
  description: A shovel configuration and status
  properties:
    name:
      type: string
      description: Name of the shovel
      example: "my-shovel"
    vhost:
      type: string
      description: Name of the virtual host
      example: "/"
    state:
      type: string
      description: Current state of the shovel
      enum:
        - Starting
        - Running
        - Stopped
        - Paused
        - Terminated
        - Error
        - Aborted
      example: "Running"
    error:
      type: string
      nullable: true
      description: Error message if the shovel is in error state
      example: null
    message_count:
      type: integer
      description: Number of messages processed by the shovel
      minimum: 0
      example: 1542
    confirmed:
      type: integer
      description: Deliveries with the Confirmed outcome
    retried:
      type: integer
      description: Deliveries with the Retry outcome
    rejected:
      type: integer
      description: Deliveries with the Reject outcome
    aborted:
      type: integer
      description: Deliveries with the Abort outcome
    consecutive_failures:
      type: integer
      description: Retry rounds in a row, which drive the delivery backoff
    consecutive_aborts:
      type: integer
      description: Abort outcomes in a row
    abort_threshold:
      type: integer
      description: Consecutive Abort outcomes that move the shovel to the Aborted state
      example: 10
  required:
    - name
    - vhost
    - state
    - message_count
