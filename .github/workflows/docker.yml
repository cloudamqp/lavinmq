name: Docker images

on:
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - Makefile
      - Dockerfile
      - shard.lock
      - src/**
      - static/**
      - views/**
      - openapi/**
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - .github/workflows/docker.yml
      - Makefile
      - Dockerfile
      - shard.lock
      - src/**
      - static/**
      - views/**
      - openapi/**
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if tag is the highest release
        id: latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --quiet --force --depth=1 origin 'refs/tags/v*:refs/tags/v*'
          highest=$(git tag -l 'v*' | grep -vE -- '-(alpha|beta|rc)' | sort -V | tail -n1)
          echo "enable=$([ "$highest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cloudamqp/lavinmq
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable == 'true' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: depot/build-push-action@v1
        with:
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MAKEFLAGS=-j1
