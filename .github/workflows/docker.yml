name: Docker images

on:
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - Makefile
      - Dockerfile
      - shard.lock
      - src/**
      - static/**
      - views/**
      - openapi/**
      - packaging/libgc/**
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - .github/workflows/docker.yml
      - Makefile
      - Dockerfile
      - shard.lock
      - src/**
      - static/**
      - views/**
      - openapi/**
      - packaging/libgc/**
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if tag is the highest release
        id: latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --quiet --force --depth=1 origin 'refs/tags/v*:refs/tags/v*'
          highest=$(git tag -l 'v*' | grep -vE -- '-(alpha|beta|rc)' | sort -V | tail -n1)
          echo "enable=$([ "$highest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cloudamqp/lavinmq
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable == 'true' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: depot/build-push-action@v1
        with:
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MAKEFLAGS=-j1

  barry:
    # A release candidate's image is out: start Barry's RC run on it
    # (84codes/barry, .github/workflows/hunt.yml). The App's credentials live
    # in the barry environment, which only v* tags may use, so a workflow on a
    # branch can't read them. The App may only start workflows in 84codes/barry.
    needs: main
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    environment: barry
    permissions: {}
    steps:
      - name: Get a token for Barry
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BARRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BARRY_APP_PRIVATE_KEY }}
          owner: 84codes
          repositories: barry
          permission-actions: write

      - name: Start Barry's RC run
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: >-
          gh api --method POST repos/84codes/barry/actions/workflows/hunt.yml/dispatches
          -f ref=main -f 'inputs[profile]=rc' -f "inputs[build]=${GITHUB_REF_NAME#v}"
