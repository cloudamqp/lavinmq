name: Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      clean: ${{ steps.result.outputs.clean }}
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Find previous review
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comment=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.author.login == "claude")] | last | .body')
          {
            DELIM="EOF_$(openssl rand -hex 16)"
            echo "body<<$DELIM"
            echo "$comment"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review ${{ github.repository }} PR #${{ env.PR }} at head ${{ github.event.pull_request.head.sha }} (checked out).
            Read AGENTS.md first. Inspect the diff with `gh pr diff`, plus relevant callers, implementations, and specs; don't build or run specs.

            Report only real issues that exist in the current head, logical errors, violations of the Rules in AGENTS.md,
            and concurrency/fiber safety. Skip linter-catchable style, nitpicks, and pre-existing issues on unchanged lines.
            Flag missing specs only for risky behavior changes, and flag new specs that are trivial or duplicate existing coverage.

            Your previous review of this PR is below. Re-check each issue in it, drop the ones that are fixed, keep the ones
            that still apply, and add new ones. Don't mention fixed issues.

            <previous_review>
            ${{ steps.previous.outputs.body }}
            </previous_review>

            If there are no issues, say "No issues found." Keep it brief and don't use emojis.

            Post the review with `gh pr comment ${{ env.PR }} --edit-last --create-if-none`.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
      - name: Check review result
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.author.login == "claude")] | last | .body')
          if grep -qi "no issues found" <<< "$body"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi

  codex-review:
    needs: review
    if: needs.review.outputs.clean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      MARKER: "<!-- codex-review -->"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Find previous review
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comment=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --slurp |
            jq --arg m "$MARKER" '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($m)))] | last')
          echo "id=$(jq -r '.id // empty' <<< "$comment")" >> "$GITHUB_OUTPUT"
          {
            DELIM="EOF_$(openssl rand -hex 16)"
            echo "body<<$DELIM"
            jq -r '.body // empty' <<< "$comment" | sed "1{/^$MARKER\$/d}"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
      - uses: openai/codex-action@v1
        id: codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt: |
            Review ${{ github.repository }} PR #${{ env.PR }} at head ${{ github.event.pull_request.head.sha }} (checked out).
            Read AGENTS.md first. Inspect the diff with `git diff ${{ github.event.pull_request.base.sha }}...HEAD`, plus relevant
            callers, implementations, and specs; don't build or run specs.

            Report only real issues that exist in the current head, logical errors, violations of the Rules in AGENTS.md,
            and concurrency/fiber safety. Skip linter-catchable style, nitpicks, and pre-existing issues on unchanged lines.
            Flag missing specs only for risky behavior changes, and flag new specs that are trivial or duplicate existing coverage.

            Your previous review of this PR is below. Re-check each issue in it, drop the ones that are fixed, keep the ones
            that still apply, and add new ones. Don't mention fixed issues.

            <previous_review>
            ${{ steps.previous.outputs.body }}
            </previous_review>

            If there are no issues, say "No issues found." Keep it brief and don't use emojis.
            Your final message is posted verbatim as a PR comment, so make it only the review.
      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ steps.codex.outputs.final-message }}
          COMMENT_ID: ${{ steps.previous.outputs.id }}
        run: |
          printf '%s\n%s\n' "$MARKER" "$REVIEW" > review.md
          if [[ -n "$COMMENT_ID" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -F body=@review.md > /dev/null
          else
            gh pr comment "$PR" --body-file review.md
          fi
