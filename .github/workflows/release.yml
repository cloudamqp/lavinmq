on:
  push:
    tags:
      - v*
  workflow_dispatch:

name: Create Release

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release
        run: |
          VERSION="${{ github.ref_name }}"
          PRERELEASE_FLAG=""
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref }}" --notes "$(./.github/generate-release-notes)" $PRERELEASE_FLAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: Attach static binaries
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - uses: depot/setup-action@v1
      - uses: depot/build-push-action@v1
        with:
          file: packaging/static-build/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          outputs: type=local,dest=builds

      - name: Smoke test
        run: docker run --rm -v "$PWD/builds/linux_amd64:/usr/local/bin:ro" ubuntu:24.04 /usr/local/bin/lavinmq --version

      - name: Package
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          for arch in amd64 arm64; do
            name="lavinmq-${VERSION}-linux-${arch}"
            mkdir "$name"
            cp "builds/linux_${arch}"/* LICENSE NOTICE README.md "$name/"
            tar -czf "dist/${name}.tar.gz" "$name"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Upload to release
        run: gh release upload "$GITHUB_REF_NAME" dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch: # initiate dispatch, send trigger to lavinmq-website
    name: Dispatch
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dispatch to workflow
        run: |
          curl -X POST https://api.github.com/repos/84codes/lavinmq-website/dispatches \
          -H 'Accept: application/vnd.github.everest-preview+json' \
          -u ${{ secrets.REPO_ACCESS_84C }} \
          --data '{"event_type": "new_release", "client_payload": { "version": "'"${{ github.ref_name }}"'" }}'
