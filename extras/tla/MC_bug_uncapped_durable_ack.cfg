\* Followers ack their whole fsynced log as durable, also entries not verified to match the leader's.
\* Expect: LeaderCompleteness
\* Mode: bfs
\* Tier: quick
CONSTANTS
    Server = {s1, s2, s3}
    Msg = {m1}
    File = {f1}
    Nil = Nil
    FileOf <- MCFileOf
    MaxTerm = 3
    MaxLogLen = 4
    MaxCrashes = 1
    DeliveryGate = "durable"
    AbstainAfterPowerLoss = FALSE
    BugStopAbstainOnContact = FALSE
    BugAckBeforeFsync = FALSE
    BugUncappedDurableAck = TRUE
    BugEagerDelete = FALSE
    BugNoTermCheck = FALSE
SPECIFICATION Spec
CONSTRAINT StateConstraint
SYMMETRY MCSymmetry
INVARIANTS
    TypeOK
    ElectionSafety
    LeaderCompleteness
    ConfirmedNotLost
    NoPhantomDelivery
    NoPrematureDelete
CHECK_DEADLOCK FALSE
