\* A leader commits entries of earlier terms by counting replicas (Raft paper, figure 8). Takes four terms with three servers.
\* Expect: LeaderCompleteness
\* Mode: bfs
\* Tier: quick
CONSTANTS
    Server = {s1, s2, s3}
    Msg = {m1}
    File = {f1}
    Nil = Nil
    FileOf <- MCFileOf
    MaxTerm = 4
    MaxLogLen = 4
    MaxCrashes = 0
    DeliveryGate = "durable"
    AbstainAfterPowerLoss = FALSE
    BugStopAbstainOnContact = FALSE
    BugAckBeforeFsync = FALSE
    BugUncappedDurableAck = FALSE
    BugEagerDelete = FALSE
    BugNoTermCheck = TRUE
SPECIFICATION Spec
CONSTRAINT StateConstraint
SYMMETRY MCSymmetry
INVARIANTS
    TypeOK
    ElectionSafety
    LeaderCompleteness
    ConfirmedNotLost
    NoPhantomDelivery
    NoPrematureDelete
CHECK_DEADLOCK FALSE
