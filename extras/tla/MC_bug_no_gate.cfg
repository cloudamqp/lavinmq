\* Must fail NoPhantomDelivery: messages are delivered before they are replicated (the raft-election branch).
CONSTANTS
    Server = {s1, s2, s3}
    Msg = {m1}
    File = {f1}
    Nil = Nil
    FileOf <- MCFileOf
    MaxTerm = 3
    MaxLogLen = 4
    MaxCrashes = 1
    DeliveryGate = "none"
    AbstainAfterPowerLoss = FALSE
    BugAckBeforeFsync = FALSE
    BugUncappedDurableAck = FALSE
    BugEagerDelete = FALSE
    BugNoTermCheck = FALSE
SPECIFICATION Spec
CONSTRAINT StateConstraint
SYMMETRY MCSymmetry
INVARIANTS
    TypeOK
    ElectionSafety
    LeaderCompleteness
    ConfirmedNotLost
    NoPhantomDelivery
    NoPrematureDelete
CHECK_DEADLOCK FALSE
