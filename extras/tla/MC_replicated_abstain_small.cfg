\* MC_replicated_abstain with two terms and up to three entries, small enough for CI.
\* Expect: pass
\* Mode: bfs
\* Tier: quick
CONSTANTS
    Server = {s1, s2, s3}
    Msg = {m1}
    File = {f1}
    Nil = Nil
    FileOf <- MCFileOf
    MaxTerm = 2
    MaxLogLen = 3
    MaxCrashes = 1
    DeliveryGate = "replicated"
    AbstainAfterPowerLoss = TRUE
    BugStopAbstainOnContact = FALSE
    BugAckBeforeFsync = FALSE
    BugUncappedDurableAck = FALSE
    BugEagerDelete = FALSE
    BugNoTermCheck = FALSE
SPECIFICATION Spec
CONSTRAINT StateConstraint
SYMMETRY MCSymmetry
INVARIANTS
    TypeOK
    ElectionSafety
    LeaderCompleteness
    ConfirmedNotLost
    NoPhantomDelivery
    NoPrematureDelete
CHECK_DEADLOCK FALSE
