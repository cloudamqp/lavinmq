\* Deliveries wait for a majority to hold the message, but a server that lost what it hadn't fsynced in a power loss still votes.
\* Expect: NoPhantomDelivery
\* Mode: bfs
\* Tier: quick
CONSTANTS
    Server = {s1, s2, s3}
    Msg = {m1}
    File = {f1}
    Nil = Nil
    FileOf <- MCFileOf
    MaxTerm = 3
    MaxLogLen = 4
    MaxCrashes = 1
    DeliveryGate = "replicated"
    AbstainAfterPowerLoss = FALSE
    BugStopAbstainOnContact = FALSE
    BugAckBeforeFsync = FALSE
    BugUncappedDurableAck = FALSE
    BugEagerDelete = FALSE
    BugNoTermCheck = FALSE
SPECIFICATION Spec
CONSTRAINT StateConstraint
SYMMETRY MCSymmetry
INVARIANTS
    TypeOK
    ElectionSafety
    LeaderCompleteness
    ConfirmedNotLost
    NoPhantomDelivery
    NoPrematureDelete
CHECK_DEADLOCK FALSE
