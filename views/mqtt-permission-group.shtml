<!--#set var="TITLE" value="MQTT permission group" -->
<!DOCTYPE html>
<html lang="en" class="mqtt-permissions">
  <head>
    <!--#include file="partials/head.shtml" -->
    <script type="module" src="js/mqtt-permission-group.js"></script>
  </head>
  <body>
    <!--#include file="partials/header.shtml" -->
    <main class="main-grid">
      <div id="breadcrumbs" class="cols-12">
          <h2 class="page-title"><!--#echo var="TITLE" --><div id="pagename-label" class="subpage-title"></div></h2>
      </div>
      <section class="card">
        <div class="table-header">
          <h2 class="has-badge">
            Members
            <small class="tiny-badge" id="members-count"></small>
          </h2>
        </div>
        <div class="table-subheader">
          <span class="table-page-info"></span>
        </div>
        <div id="members-error"></div>
        <div class="table-wrapper">
          <table id="members" class="table">
            <thead>
              <tr>
                <th data-sort-key="username" class="left">Username<span></span></th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <form method="put" id="addMember" class="form card cols-6">
        <h3>Add member</h3>
        <label>
          <span>
            <a class="prop-tooltip">Username<span class="tooltip-icon">?</span>
              <span class="prop-tooltiptext">Use * to apply the group to every authenticated user.</span>
            </a>
          </span>
          <input type="text" name="username" list="userList" required autocomplete="off">
          <datalist id="userList"></datalist>
        </label>
        <button type="submit" class="btn btn-green">Add member</button>
      </form>
      <section class="card">
        <div class="table-header">
          <h2 class="has-badge">
            Rules
            <small class="tiny-badge" id="rules-count"></small>
          </h2>
        </div>
        <div id="rules-error"></div>
        <div class="table-wrapper">
          <table id="rules" class="table">
            <thead>
              <tr>
                <th class="left">Identifier</th>
                <th class="left">Topic pattern</th>
                <th>Read</th>
                <th>Write</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <form method="put" id="setRule" class="form card cols-6">
        <h3>
          <span class="when-create">Add rule</span>
          <span class="when-edit">Edit rule</span>
        </h3>
        <label>
          <span>Identifier</span>
          <input type="text" name="identifier" required data-primary-key="" pattern="[A-Za-z0-9\-]+" title="Alphanumerics and hyphens">
        </label>
        <label>
          <span>
            <a class="prop-tooltip">Topic pattern<span class="tooltip-icon">?</span>
              <span class="prop-tooltiptext">An MQTT topic filter. + matches one level and # matches the rest. {client_id} as a whole level is replaced with the client ID of the connection, so chat/{client_id}/# gives each device its own subtree.</span>
            </a>
          </span>
          <input type="text" name="pattern" required placeholder="chat/{client_id}/#">
        </label>
        <label>
          <span>
            <a class="prop-tooltip">Read<span class="tooltip-icon">?</span>
              <span class="prop-tooltiptext">Allow clients to receive messages on topics matching the pattern.</span>
            </a>
          </span>
          <input type="checkbox" name="read" checked>
        </label>
        <label>
          <span>
            <a class="prop-tooltip">Write<span class="tooltip-icon">?</span>
              <span class="prop-tooltiptext">Allow clients to publish to topics matching the pattern.</span>
            </a>
          </span>
          <input type="checkbox" name="write" checked>
        </label>
        <button type="submit" class="btn btn-green when-create">Add rule</button>
        <div class="when-edit flex gap-2 flex-row">
          <button type="submit" class="btn btn-green">Update</button>
          <button type="reset" class="btn btn-outlined cancel">Cancel</button>
        </div>
      </form>
      <section class="card cols-4">
        <h3>Delete group</h3>
        <form method="delete" id="deleteGroup" class="form">
          <button type="submit" class="btn btn-red btn-inline">Delete group</button>
        </form>
      </section>
    </main>
    <!--#include file="partials/footer.shtml" -->
  </body>
</html>
