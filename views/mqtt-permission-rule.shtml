<!--#set var="TITLE" value="MQTT permission rule" -->
<!DOCTYPE html>
<html lang="en" class="mqtt-permissions">
  <head>
    <!--#include file="partials/head.shtml" -->
    <script type="module" src="js/mqtt-permission-rule.js"></script>
  </head>
  <body>
    <!--#include file="partials/header.shtml" -->
    <main class="main-grid">
      <div id="breadcrumbs" class="cols-12">
          <h2 class="page-title"><!--#echo var="TITLE" --><div id="pagename-label" class="subpage-title"></div></h2>
      </div>
      <section class="card cols-6">
        <h3>Rule</h3>
        <table class="details-table">
          <tr>
            <th>Identifier</th>
            <td id="rule-identifier"></td>
          </tr>
          <tr>
            <th>Group</th>
            <td><a id="group-link"></a></td>
          </tr>
          <tr>
            <th>Virtual host</th>
            <td id="rule-vhost"></td>
          </tr>
        </table>
      </section>
      <form method="put" id="setRule" class="form card cols-6">
        <h3>Edit rule</h3>
        <label>
          <span>
            <a class="prop-tooltip">Topic pattern<span class="tooltip-icon">?</span>
              <span class="prop-tooltiptext">An MQTT topic filter. + matches one level and # matches the rest. {client_id} as a whole level is replaced with the client ID of the connection, so chat/{client_id}/# gives each device its own subtree.</span>
            </a>
          </span>
          <input type="text" name="pattern" required placeholder="chat/{client_id}/#">
        </label>
        <label>
          <span>
            <a class="prop-tooltip">Read<span class="tooltip-icon">?</span>
              <span class="prop-tooltiptext">Allow clients to receive messages on topics matching the pattern.</span>
            </a>
          </span>
          <input type="checkbox" name="read" checked>
        </label>
        <label>
          <span>
            <a class="prop-tooltip">Write<span class="tooltip-icon">?</span>
              <span class="prop-tooltiptext">Allow clients to publish to topics matching the pattern.</span>
            </a>
          </span>
          <input type="checkbox" name="write" checked>
        </label>
        <div class="flex gap-2 flex-row">
          <button type="submit" class="btn btn-green">Update</button>
          <a id="cancel-link" class="btn btn-outlined">Cancel</a>
        </div>
      </form>
      <section class="card cols-4">
        <h3>Delete rule</h3>
        <form method="delete" id="deleteRule" class="form">
          <button type="submit" class="btn btn-red btn-inline">Delete rule</button>
        </form>
      </section>
    </main>
    <!--#include file="partials/footer.shtml" -->
  </body>
</html>
