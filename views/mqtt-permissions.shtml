<!--#set var="TITLE" value="MQTT permissions" -->
<!DOCTYPE html>
<html lang="en" class="mqtt-permissions">
  <head>
    <!--#include file="partials/head.shtml" -->
    <script type="module" src="js/mqtt-permissions.js"></script>
  </head>
  <body>
    <!--#include file="partials/header.shtml" -->
    <main class="main-grid">
      <div id="breadcrumbs" class="cols-12">
          <h2 class="page-title"><span><!--#echo var="TITLE" --></span><div class="tiny-badge" id="pagename-label"></div></h2>
      </div>
      <section class="card">
        <div class="table-header">
          <h2>Manage permission groups</h2>
        </div>
        <div class="table-subheader">
          <span class="table-page-info"></span>
        </div>
        <div id="groups-error"></div>
        <div class="table-wrapper">
          <table id="groups" class="table">
            <thead>
              <tr>
                <th data-sort-key="name" class="left">Name<span></span></th>
                <th class="left">Virtual host</th>
                <th>Members</th>
                <th>Rules</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <form method="put" id="createGroup" class="form card cols-6">
        <h3>Add group</h3>
        <label>
          <span>Virtual host</span>
          <select class="dropdown" name="vhost" required></select>
        </label>
        <label>
          <span>Name</span>
          <input type="text" name="name" required pattern="[A-Za-z0-9_\-]{1,255}" title="Alphanumerics, hyphens and underscores, at most 255 characters">
        </label>
        <button type="submit" class="btn btn-green">Add group</button>
      </form>
    </main>
    <!--#include file="partials/footer.shtml" -->
  </body>
</html>
